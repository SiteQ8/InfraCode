<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfraCode — Infrastructure as Code Platform</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-tertiary: #1a2235;
  --bg-card: #151d2e;
  --bg-hover: #1e293b;
  --border: #1e3a5f;
  --border-focus: #3b82f6;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-blue: #3b82f6;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-yellow: #f59e0b;
  --accent-red: #ef4444;
  --accent-purple: #8b5cf6;
  --accent-orange: #f97316;
  --glow-blue: rgba(59, 130, 246, 0.15);
  --glow-green: rgba(16, 185, 129, 0.15);
  --glow-red: rgba(239, 68, 68, 0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Animated background grid */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    linear-gradient(rgba(59,130,246,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(59,130,246,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  z-index: 0;
  pointer-events: none;
}

.app { position: relative; z-index: 1; display: flex; min-height: 100vh; }

/* Sidebar */
.sidebar {
  width: 260px;
  background: var(--bg-secondary);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

.sidebar-logo {
  padding: 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 36px; height: 36px;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 700; font-size: 16px; color: white;
}

.logo-text { font-weight: 600; font-size: 18px; letter-spacing: -0.5px; }
.logo-version { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

.sidebar-nav { flex: 1; padding: 12px; overflow-y: auto; }

.nav-section { margin-bottom: 20px; }
.nav-section-title {
  font-size: 10px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--text-muted);
  padding: 8px 12px; margin-bottom: 4px;
}

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border-radius: 8px;
  cursor: pointer; transition: all 0.15s;
  font-size: 14px; color: var(--text-secondary);
  border: 1px solid transparent;
}

.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: var(--glow-blue);
  color: var(--accent-blue);
  border-color: rgba(59,130,246,0.2);
}

.nav-icon { width: 18px; text-align: center; font-size: 14px; opacity: 0.8; }

.sidebar-footer {
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  font-size: 12px; color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}

/* Main Content */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  height: 56px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
}

.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-actions { display: flex; gap: 8px; }

.btn {
  padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--bg-tertiary); color: var(--text-primary);
  font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 6px;
}

.btn:hover { background: var(--bg-hover); border-color: var(--border-focus); }
.btn-primary { background: var(--accent-blue); border-color: var(--accent-blue); color: white; }
.btn-primary:hover { background: #2563eb; }
.btn-success { background: var(--accent-green); border-color: var(--accent-green); color: white; }
.btn-danger { background: var(--accent-red); border-color: var(--accent-red); color: white; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Cards */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 16px;
  overflow: hidden;
}

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
}

.card-title { font-size: 14px; font-weight: 600; }
.card-body { padding: 20px; }

/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.stat-card::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 2px;
}

.stat-card.blue::after { background: var(--accent-blue); }
.stat-card.green::after { background: var(--accent-green); }
.stat-card.yellow::after { background: var(--accent-yellow); }
.stat-card.purple::after { background: var(--accent-purple); }

.stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
.stat-sub { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }

/* Editor */
.editor-container {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.editor-tabs {
  display: flex;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
}

.editor-tab {
  padding: 10px 20px;
  font-size: 13px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--text-muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}

.editor-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
.editor-tab.active { color: var(--accent-blue); border-bottom-color: var(--accent-blue); }

.editor-body { position: relative; }

.editor-textarea {
  width: 100%;
  min-height: 400px;
  background: transparent;
  color: var(--accent-green);
  border: none;
  padding: 16px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.7;
  resize: vertical;
  outline: none;
  tab-size: 2;
}

/* Plan Output */
.plan-output {
  background: #0d1117;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px 20px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.8;
  max-height: 500px;
  overflow-y: auto;
  white-space: pre-wrap;
  color: var(--text-secondary);
}

.plan-create { color: var(--accent-green); }
.plan-update { color: var(--accent-yellow); }
.plan-delete { color: var(--accent-red); }
.plan-noop { color: var(--text-muted); }

/* Resource Table */
.resource-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

.resource-table th {
  text-align: left;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}

.resource-table td {
  padding: 12px 16px;
  border-bottom: 1px solid rgba(30,58,95,0.3);
  color: var(--text-secondary);
}

.resource-table tr:hover td { background: var(--bg-hover); }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  font-family: 'JetBrains Mono', monospace;
}

.badge-active { background: var(--glow-green); color: var(--accent-green); border: 1px solid rgba(16,185,129,0.3); }
.badge-pending { background: rgba(245,158,11,0.1); color: var(--accent-yellow); border: 1px solid rgba(245,158,11,0.3); }
.badge-failed { background: var(--glow-red); color: var(--accent-red); border: 1px solid rgba(239,68,68,0.3); }

.badge-critical { background: var(--glow-red); color: var(--accent-red); }
.badge-high { background: rgba(249,115,22,0.1); color: var(--accent-orange); }
.badge-medium { background: rgba(245,158,11,0.1); color: var(--accent-yellow); }
.badge-low { background: var(--glow-blue); color: var(--accent-blue); }

.provider-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 6px; font-size: 11px;
  font-weight: 600; font-family: 'JetBrains Mono', monospace;
}

.provider-aws { background: rgba(255,153,0,0.1); color: #ff9900; }
.provider-azure { background: rgba(0,120,215,0.1); color: #0078d7; }
.provider-gcp { background: rgba(66,133,244,0.1); color: #4285f4; }
.provider-kubernetes { background: rgba(50,109,230,0.1); color: #326de6; }

/* Compliance */
.compliance-score {
  width: 120px; height: 120px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 700;
  font-family: 'JetBrains Mono', monospace;
  margin: 0 auto 16px;
}

.score-high { background: var(--glow-green); color: var(--accent-green); border: 3px solid var(--accent-green); }
.score-medium { background: rgba(245,158,11,0.1); color: var(--accent-yellow); border: 3px solid var(--accent-yellow); }
.score-low { background: var(--glow-red); color: var(--accent-red); border: 3px solid var(--accent-red); }

/* Progress bar */
.progress-bar {
  height: 6px; border-radius: 3px;
  background: var(--bg-tertiary);
  overflow: hidden;
}

.progress-fill {
  height: 100%; border-radius: 3px;
  transition: width 0.5s ease;
}

/* Security findings */
.finding {
  padding: 14px 16px;
  border-left: 3px solid;
  background: var(--bg-tertiary);
  border-radius: 0 8px 8px 0;
  margin-bottom: 10px;
}

.finding-critical { border-left-color: var(--accent-red); }
.finding-high { border-left-color: var(--accent-orange); }
.finding-medium { border-left-color: var(--accent-yellow); }
.finding-low { border-left-color: var(--accent-blue); }

.finding-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.finding-desc { font-size: 12px; color: var(--text-secondary); }
.finding-fix { font-size: 11px; color: var(--accent-cyan); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }

/* Template browser */
.template-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

.template-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
}

.template-card:hover {
  border-color: var(--accent-blue);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.template-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.template-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; line-height: 1.5; }
.template-meta { display: flex; gap: 8px; flex-wrap: wrap; }

/* History timeline */
.timeline-item {
  display: flex; gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid rgba(30,58,95,0.3);
}

.timeline-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-top: 5px;
  flex-shrink: 0;
}

.timeline-dot.success { background: var(--accent-green); }
.timeline-dot.failed { background: var(--accent-red); }
.timeline-dot.pending { background: var(--accent-yellow); }

.timeline-content { flex: 1; }
.timeline-action { font-size: 13px; font-weight: 600; }
.timeline-detail { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
.timeline-time { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Responsive */
@media (max-width: 1024px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .sidebar { width: 220px; }
}
@media (max-width: 768px) {
  .sidebar { display: none; }
  .stats-grid { grid-template-columns: 1fr; }
}

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.animate-in { animation: fadeIn 0.3s ease forwards; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
.pulse { animation: pulse 2s ease-in-out infinite; }

.mono { font-family: 'JetBrains Mono', monospace; }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── Sample Data ─────────────────────────────────────────────────────────

const SAMPLE_TEMPLATE = `infracode:
  version: "1.0"

name: production-infrastructure
description: Multi-tier production environment
provider: aws

variables:
  environment:
    type: string
    default: production
  region:
    type: string
    default: us-east-1
  vpc_cidr:
    type: string
    default: "10.0.0.0/16"

resources:
  main-vpc:
    type: aws_vpc
    name: "\${var.environment}-vpc"
    cidr_block: "\${var.vpc_cidr}"
    enable_dns_support: true
    enable_dns_hostnames: true
    tags:
      Environment: "\${var.environment}"

  public-subnet-1:

    availability_zone: "\${var.region}a"
    map_public_ip_on_launch: true
    depends_on:
      - main-vpc

  private-subnet-1:
    type: aws_subnet
    name: "\${var.environment}-private-1"

    vpc_id: "\${main-vpc.vpc_id}"

      - from_port: 443
        to_port: 443
        protocol: tcp
        cidr_blocks:
          - "0.0.0.0/0"
    depends_on:
      - main-vpc

  data-bucket:
    type: aws_s3_bucket
    name: "\${var.environment}-data"
    bucket: "myapp-data-\${var.environment}"
    acl: private
    versioning:
      enabled: true
    encryption:
      sse_algorithm: aws:kms
    public_access_block:
      block_public_acls: true
      block_public_policy: true

  primary-database:
    type: aws_rds_instance
    name: "\${var.environment}-db"
    engine: postgres
    instance_class: db.t3.medium
    allocated_storage: 100
    storage_encrypted: true
    multi_az: true
    publicly_accessible: false
    master_username: "\${vault.db_username}"
    master_password: "\${vault.db_password}"
    depends_on:
      - main-vpc
      - private-subnet-1`;

const SAMPLE_RESOURCES = [

// Dashboard
const Dashboard = () => (
  <div className="animate-in">
    <div className="stats-grid">
      <div className="stat-card blue">

// Template Editor
const Editor = () => {

    setValidationResult({ valid: true, issues: [
      { level: "info", message: "Template validation passed" },
      { level: "info", message: "6 resources defined" },
      { level: "info", message: "All dependencies resolved" },
      { level: "info", message: "No circular dependencies" },

    setActiveTab('output');
  };

  const handlePlan = () => {
    setPlanOutput(`╔══════════════════════════════════════════════════╗
║         InfraCode Execution Plan                 ║
╠══════════════════════════════════════════════════╣
║  Template: production-infrastructure             ║
║  Provider: aws                                   ║
╠══════════════════════════════════════════════════╣
║  [+] main-vpc                   CREATE           ║
║      type: aws_vpc                               ║
║      cidr_block: 10.0.0.0/16                     ║
║                                                  ║
║  [+] public-subnet-1            CREATE           ║
║      type: aws_subnet                            ║
║      cidr_block: 10.0.1.0/24                     ║
║                                                  ║
║  [+] private-subnet-1           CREATE           ║
║      type: aws_subnet                            ║
║      cidr_block: 10.0.10.0/24                    ║
║                                                  ║
║  [+] web-sg                     CREATE           ║
║      type: aws_security_group                    ║
║                                                  ║
║  [+] data-bucket                CREATE           ║
║      type: aws_s3_bucket                         ║
║      encryption: aws:kms                         ║
║                                                  ║
║  [+] primary-database           CREATE           ║
║      type: aws_rds_instance                      ║
║      engine: postgres | multi_az: true           ║
╠══════════════════════════════════════════════════╣
║  Summary:                                        ║
║    + Create:  6                                  ║
║    ~ Update:  0                                  ║
║    - Delete:  0                                  ║
║    = No-op:   0                                  ║
║                                                  ║
║  Estimated time: ~7 minutes                      ║
╚══════════════════════════════════════════════════╝`);
    setValidationResult(null);
    setActiveTab('output');
  };

  return (
    <div className="animate-in">
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <button className="btn btn-primary" onClick={handleValidate}>
          <Icon name="validate" /> Validate
        </button>
        <button className="btn" onClick={handlePlan} style={{ borderColor: 'var(--accent-cyan)', color: 'var(--accent-cyan)' }}>
          <Icon name="plan" /> Plan
        </button>
        <button className="btn btn-success">
          <Icon name="apply" /> Apply
        </button>
        <button className="btn" onClick={() => { setPlanOutput(''); setValidationResult(null); }}>
          <Icon name="scan" /> Security Scan
        </button>
      </div>

      <div className="editor-container">
        <div className="editor-tabs">
          <div className={`editor-tab ${activeTab === 'editor' ? 'active' : ''}`} onClick={() => setActiveTab('editor')}>
            infrastructure.yaml
          </div>
          <div className={`editor-tab ${activeTab === 'output' ? 'active' : ''}`} onClick={() => setActiveTab('output')}>
            Output
          </div>
        </div>

        <div className="editor-body">
          {activeTab === 'editor' ? (
            <textarea
              className="editor-textarea"
              value={template}
              onChange={e => setTemplate(e.target.value)}
              spellCheck={false}
            />
          ) : (
            <div style={{ padding: 16 }}>
              {validationResult && (
                <div>
                  {validationResult.issues.map((issue, i) => (
                    <div key={i} style={{ padding: '8px 12px', marginBottom: 6, borderRadius: 6, background: issue.level === 'info' ? 'var(--glow-green)' : 'var(--glow-red)', color: issue.level === 'info' ? 'var(--accent-green)' : 'var(--accent-red)', fontFamily: "'JetBrains Mono', monospace", fontSize: 13 }}>
                      {issue.level === 'info' ? '✓' : '✗'} {issue.message}
                    </div>
                  ))}
                </div>
              )}
              {planOutput && <div className="plan-output">{planOutput}</div>}
              {!validationResult && !planOutput && (
                <div style={{ color: 'var(--text-muted)', textAlign: 'center', padding: 60 }}>
                  Click Validate, Plan, or Apply to see output here
                </div>
              )}
            </div>
          )}
        </div>
      </div>
    </div>
  );
};
